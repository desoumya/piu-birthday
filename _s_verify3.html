<!doctype html>
<meta charset="utf-8">
<title>verify3</title>
<style>html,body{margin:0;background:#111}#out{color:#0f0;white-space:pre-wrap;font:12px monospace;padding:8px}iframe{width:1200px;height:800px;border:1px solid #333}</style>
<body>
<pre id="out"></pre>
<iframe id="f" src="_s_index_debug.html" title="test"></iframe>
<script>
function log(s){ const o=document.getElementById('out'); o.textContent += s+'\n'; }
function waitFor(fn, timeout=15000, interval=80){
  return new Promise((resolve,reject)=>{
    const t0=Date.now();
    (function tick(){
      let v; try{ v=fn(); }catch(e){ v=false; }
      if (v){ resolve(v); return; }
      if (Date.now()-t0>timeout){ reject(new Error('timeout: '+fn.toString())); return; }
      setTimeout(tick, interval);
    })();
  });
}

async function run(){
  const frame = document.getElementById('f');
  await waitFor(() => {
    try {
      return frame.contentWindow && frame.contentWindow.location.href.endsWith('_s_index_debug.html') &&
        frame.contentDocument.readyState === 'complete';
    } catch(e){ return false; }
  }, 15000, 50);
  const w = frame.contentWindow, d = frame.contentDocument;
  const $ = id => d.getElementById(id);
  log('--- boot ---');

  function scratchCard(card){
    const canvas = card.querySelector('.scratch');
    const r = canvas.getBoundingClientRect();
    const step = 18;
    for (let y = r.top + 8; y < r.bottom - 8; y += step){
      for (let x = r.left + 8; x < r.right - 8; x += step){
        canvas.dispatchEvent(new w.PointerEvent('pointerdown', {bubbles:true, pointerId:1, clientX:x, clientY:y}));
        canvas.dispatchEvent(new w.PointerEvent('pointermove', {bubbles:true, pointerId:1, clientX:x, clientY:y}));
        canvas.dispatchEvent(new w.PointerEvent('pointerup',   {bubbles:true, pointerId:1, clientX:x, clientY:y}));
      }
    }
  }

  await waitFor(() => $('preludeBegin') && w.getComputedStyle($('preludeBegin')).opacity > 0.5, 12000);
  $('preludeBegin').click();
  await waitFor(() => !$('gate').hidden, 5000);
  $('openGate').click();
  await waitFor(() => $('celContinue').classList.contains('show'), 10000);
  $('celContinue').click();
  await waitFor(() => !$('journeySlide').hidden, 8000);
  $('jsSkip').click();
  await waitFor(() => !$('cakeSlide').hidden, 8000);
  await waitFor(() => !$('cakeBtn').disabled, 16000);
  $('cakeBtn').dispatchEvent(new w.PointerEvent('pointerdown', {bubbles:true, pointerId:1}));
  await waitFor(() => $('cakeStage').classList.contains('blown'), 4000);
  log('cake done');

  await waitFor(() => !$('cardsSlide').hidden, 12000);
  await waitFor(() => $('cardGrid').querySelectorAll('.scard[data-scratch-ready="1"]').length === 5, 6000);
  d.querySelectorAll('#cardGrid .scard').forEach(scratchCard);
  await waitFor(() => d.querySelectorAll('#cardGrid .scard.done').length === 5, 8000);
  log('5 secrets done');

  await waitFor(() => !$('finalSlide').hidden, 10000);
  log('=== FINAL SLIDE ===');
  const finalCard = $('finalSlide').querySelector('.scard');
  await waitFor(() => finalCard.dataset.scratchReady === '1', 6000);
  log('PASS Final Surprise is a scratch card again');
  scratchCard(finalCard);
  await waitFor(() => finalCard.classList.contains('scratched'), 4000);
  await waitFor(() => $('modalOverlay').classList.contains('open'), 9000);
  const video = $('finalVideo');
  log('PASS modal opened with video: src has birthday-wish.mp4 = ' + (video && video.querySelector('source').src.includes('birthday-wish.mp4')));
  $('modalClose').click();

  await waitFor(() => !$('transition').hidden, 6000);
  const l1 = $('transition').querySelector('.int-line.l1');
  await waitFor(() => l1.classList.contains('show'), 4000);
  log('PASS "Wait, this isn\\'t the end" transition text: "' + l1.textContent + '"');
  $('transSkip').click();

  await waitFor(() => !$('boxSlide').hidden, 6000);
  await waitFor(() => $('chestStage'), 6000);
  log('=== BOX BLAST ===');
  await waitFor(() => $('chestStage').classList.contains('opened'), 6000);
  log('PASS blast box opened on its own');
  await waitFor(() => {
    const lines = Array.from($('chestReveal').querySelectorAll('.chest-msg-line'));
    return lines.length === 3 && lines.every(l => l.classList.contains('show'));
  }, 8000);
  log('PASS real-box message revealed from blast box: "' + $('chestReveal').querySelector('.l1').textContent + '"');
  await waitFor(() => $('chestContinue').classList.contains('show'), 4000);
  $('chestContinue').click();

  await waitFor(() => $('openedYes'), 6000);
  $('openedYes').click();
  await waitFor(() => $('likeYes'), 6000);
  $('likeYes').click();
  await waitFor(() => $('confirmBtn'), 6000);
  log('rushing through confirm rounds...');
  for (let i=0;i<4;i++){
    await waitFor(() => $('confirmBtn'), 6000);
    $('confirmBtn').click();
    await new Promise(r => setTimeout(r, 300));
  }

  await waitFor(() => !$('endingSlide').hidden, 8000);
  log('=== ENDING SLIDE reached ===');

  await waitFor(() => !$('epilogueSlide').hidden, 14000);
  log('=== EPILOGUE reached (black screen) ===');
  const bg = w.getComputedStyle($('epilogueSlide')).backgroundColor;
  log('epilogue background-color: ' + bg);
  const lines = Array.from($('epilogueInner').querySelectorAll('.epilogue-line'));
  await waitFor(() => lines.every(l => l.classList.contains('show')), 12000);
  log('PASS all epilogue lines shown: ' + lines.map(l => l.textContent).join(' | '));
  await waitFor(() => $('epilogueInner').classList.contains('fade-out'), 10000);
  log('PASS epilogue text faded out, leaving black screen as final state');

  log('--- ALL CHECKS COMPLETE ---');
  window.__done = true;
}
run().catch(e => {
  log('FATAL: ' + e.message);
  try { log('page errors: ' + JSON.stringify(document.getElementById('f').contentWindow.__errs)); } catch(err){}
  window.__done = true; window.__fatal = true;
});
</script>
